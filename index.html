<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061126">
<title>Match It!</title>
<style>
:root{
  --bg:#061126;--panel:#0c1a2c;--panel2:#101f34;--line:#29415f;
  --text:#fff;--muted:#b8c7da;--blue:#2476ff;--blue2:#55a1ff;
  --yellow:#ffd21f;--orange:#ff8a1f;--green:#18d75b;--red:#ff4b55
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#10294e 0,var(--bg) 58%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{touch-action:manipulation}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.shell{width:min(100%,980px);margin:auto;padding:12px}
.title-screen{display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.title-art{display:block;width:min(100%,960px);max-height:760px;object-fit:contain;border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.42)}
.play-btn{margin-top:20px;width:min(100%,560px);min-height:76px;border:0;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:30px;font-weight:950;letter-spacing:.08em;cursor:pointer;box-shadow:0 16px 42px rgba(36,118,255,.38)}
.card{background:rgba(12,26,44,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.mode-card{width:min(100%,680px);margin:36px auto;padding:22px}
.mode-card h2{text-align:center;margin:0 0 6px;font-size:34px}
.mode-card>p{text-align:center;color:var(--muted);margin:0 0 18px}
.mode-grid{display:grid;gap:14px}
.mode-btn{text-align:left;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:#fff;cursor:pointer}
.mode-btn strong{display:block;font-size:22px;margin-bottom:5px}
.mode-btn span{color:var(--muted);line-height:1.4}
.mode-btn.daily{background:linear-gradient(135deg,#0d8f39,#19c957)}
.upload-area{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.upload-area.show{display:block}
.upload-label,.btn{display:inline-block;border:0;border-radius:13px;padding:14px 18px;color:#fff;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--blue2));text-align:center}
.btn.secondary{background:var(--panel2);border:1px solid var(--line)}
.btn.yellow{background:linear-gradient(135deg,#ffb800,#ffd21f);color:#162033}
#upload{display:none}
.preview{display:none;width:100%;max-height:340px;object-fit:cover;margin-top:14px;border-radius:14px;border:1px solid var(--line)}
.preview.show{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand{font-size:28px;font-weight:950}
.brand small{display:block;font-size:11px;color:var(--yellow);letter-spacing:.16em;text-transform:uppercase}
.pill{padding:8px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:800}
.image-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.image-card{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:#020711}
.target-card.hidden canvas{visibility:hidden}
.target-cover{display:none;position:absolute;inset:0;z-index:3;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(145deg,#071326,#102746);font-size:22px;font-weight:950;color:var(--muted)}
.target-card.hidden .target-cover{display:flex}
.preview-countdown{position:absolute;right:10px;top:10px;z-index:4;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.78);font-weight:950;color:var(--yellow)}
.image-label{position:absolute;z-index:2;top:10px;left:10px;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.76);font-size:11px;font-weight:900;letter-spacing:.08em}
.image-label.target{background:rgba(24,215,91,.92);color:#06130b}
canvas{display:block;width:100%;aspect-ratio:1/1}
.panel{margin-top:12px;padding:12px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.control{padding:9px 11px;background:var(--panel2);border-radius:11px}
.control-head{display:flex;justify-content:space-between;font-size:13px;font-weight:800;text-transform:capitalize}
.value{color:var(--yellow)}
input[type=range]{display:block;width:100%;margin:8px 0 0;accent-color:var(--blue)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.status{text-align:center;color:var(--muted);margin-top:9px;font-weight:800}
.history{display:grid;gap:6px;margin-top:9px}
.try{display:grid;grid-template-columns:74px 1fr 84px;gap:8px;align-items:center;padding:8px;background:var(--panel2);border-radius:9px;font-size:13px}
.bar{height:9px;background:#213651;border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow),var(--green))}
#results{display:none;margin-top:12px;padding:16px}
#results h2{font-size:50px;color:var(--yellow);text-align:center;margin:0 0 8px}
.rating-badge{display:inline-flex;align-items:center;justify-content:center;min-width:78px;padding:8px 14px;border-radius:999px;font-weight:950;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.result-message{text-align:center;font-size:22px;font-weight:900;margin-bottom:12px}
.winner{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--line);text-transform:capitalize}
th{color:var(--muted)}
.feedback-badge{display:inline-flex;align-items:center;justify-content:center;min-width:90px;padding:9px 14px;border-radius:999px;font-weight:950;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.feedback-key{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:12px;font-weight:900}
.gradient-key{width:min(100%,360px);height:14px;border-radius:99px;background:linear-gradient(90deg,hsl(0 85% 48%),hsl(30 90% 50%),hsl(58 92% 50%),hsl(90 75% 44%),hsl(120 75% 42%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
@media(max-width:700px){
  .shell{padding:8px}
  .image-grid,.controls,.actions{grid-template-columns:1fr}
  .title-screen{justify-content:flex-start;padding-top:8px}
  .title-art{border-radius:14px;max-height:none}
  .play-btn{min-height:68px;font-size:26px}
}
</style>
</head>

<section id="modeScreen" class="screen">
  <div class="shell">
    <div class="card mode-card">
      <h2>Choose a Mode</h2>
      <p>Play today’s shared target or practice with your own image.</p>
      <div class="mode-grid">
        <button id="dailyBtn" class="mode-btn daily">
          <strong>🌎 Daily Challenge</strong>
          <span>Everyone plays the same image and target. Five chances. Earn a 9 or 10 to win.</span>
        </button>
        <button id="sandboxBtn" class="mode-btn">
          <strong>🧪 Sandbox Mode</strong>
          <span>Upload any image and practice locally with a randomly created target.</span>
        </button>
      </div>
      <div id="uploadArea" class="upload-area">
        <label class="upload-label" for="upload">Choose Your Image</label>
        <input id="upload" type="file" accept="image/*">
        <img id="preview" class="preview" alt="Selected image preview">
        <button id="startSandboxBtn" class="btn" style="display:none;width:100%;margin-top:12px">Start Sandbox</button>
      </div>
      <button id="modeBackBtn" class="btn secondary" style="width:100%;margin-top:16px">Back</button>
    </div>
  </div>
</section>

<section id="gameScreen" class="screen">
  <div class="shell">
    <div class="topbar">
      <div class="brand">Match It!<small id="modeLabel">Daily Challenge</small></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="pill">Attempt <span id="attempt">1</span>/5</div>
        <button id="quitBtn" class="btn secondary" style="padding:8px 12px">Quit</button>
      </div>
    </div>

    <div class="image-grid">
      <div class="image-card">
        <div class="image-label">YOUR EDIT</div>
        <canvas id="player" width="700" height="700"></canvas>
      </div>
      <div id="targetCard" class="image-card target-card">
        <div class="image-label target">TARGET</div>
        <div id="previewCountdown" class="preview-countdown"></div>
        <canvas id="target" width="700" height="700"></canvas>
        <div class="target-cover">Target hidden.<br>Match it from memory.</div>
      </div>
    </div>

    <div class="card panel">
      <div id="controls" class="controls"></div>
      <div class="actions">
        <button id="submitBtn" class="btn yellow">Submit Edit</button>
        <button id="resetBtn" class="btn secondary">Reset Sliders</button>
        <button id="peekBtn" class="btn secondary" style="grid-column:1/-1">View Target — Costs 1 Attempt</button>
      </div>
      <div id="status" class="status">Adjust the sliders, then submit your edit.</div>
      <div id="history" class="history"></div>
    </div>

    <div id="results" class="card">
      <h2 id="bestScore">Rating 1/10</h2>
      <div id="resultMessage" class="result-message"></div>
      <div class="feedback-key" aria-label="Rating color scale">
        <strong>1 · Not Close</strong>
        <div class="gradient-key"></div>
        <strong>10 · Right On</strong>
      </div>
      <table>
        <thead><tr><th>Setting</th><th>How Close?</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="actions">
        <button id="againBtn" class="btn">Play Again</button>
        <button id="changeModeBtn" class="btn secondary">Change Mode</button>
      </div>
      <div class="note">A rating of 9 or 10 is a win.</div>
    </div>
  </div>
</section>

const defs = [
  {id:"hue",name:"Hue",min:-90,max:90,step:1,unit:"°"},
  {id:"saturation",name:"Saturation",min:40,max:180,step:1,unit:"%"},
  {id:"brightness",name:"Brightness",min:55,max:145,step:1,unit:"%"},
  {id:"contrast",name:"Contrast",min:55,max:145,step:1,unit:"%"},
  {id:"warmth",name:"Warmth",min:-40,max:40,step:1,unit:""},
  {id:"mist",name:"Mist",min:0,max:35,step:1,unit:"%"}
];

const playerCanvas=document.getElementById("player");
const targetCanvas=document.getElementById("target");
const pctx=playerCanvas.getContext("2d");
const tctx=targetCanvas.getContext("2d");

let mode="daily";
let selectedImageData="";
let gameImage=null;
let targetValues={};
let tries=0;
let scores=[];
let bestScore=0;
let bestValues=neutralValues();
let previewTimer=null;
let targetVisible=false;

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

function seededRandom(seed){
  let x=Math.sin(seed)*10000;
  return x-Math.floor(x);
}

function dateSeed(dateText){
  const d=dateText ? new Date(dateText + "T12:00:00") : new Date();
  return Number(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`);
}

function makeTarget(seed=Math.random()*999999){
  const r=n=>seededRandom(seed+n);
  return {
    hue:Math.round(-32+r(1)*64),
    saturation:Math.round(80+r(2)*70),
    brightness:Math.round(82+r(3)*38),
    contrast:Math.round(80+r(4)*42),
    warmth:Math.round(-20+r(5)*40),
    mist:Math.round(r(6)*16)
  };
}

function buildControls(){
  const wrap=document.getElementById("controls");
  wrap.innerHTML=defs.map(d=>`
    <label class="control">
      <div class="control-head"><span>${d.name}</span><span id="${d.id}Value" class="value"></span></div>
      <input id="${d.id}" type="range" min="${d.min}" max="${d.max}" step="${d.step}">
    </label>`).join("");
  defs.forEach(d=>{
    const el=document.getElementById(d.id);
    el.addEventListener("input",()=>{updateValue(d);renderPlayer();});
  });
}

function neutralValues(){
  return {hue:0,saturation:100,brightness:100,contrast:100,warmth:0,mist:0};
}

function setValues(v=neutralValues()){
  defs.forEach(d=>{
    document.getElementById(d.id).value=v[d.id];
    updateValue(d);
  });
  renderPlayer();
}

function updateValue(d){
  document.getElementById(d.id+"Value").textContent=document.getElementById(d.id).value+d.unit;
}

function currentValues(){
  const v={};
  defs.forEach(d=>v[d.id]=Number(document.getElementById(d.id).value));
  return v;
}

function fitDraw(ctx,img){
  const cw=ctx.canvas.width,ch=ctx.canvas.height;
  const scale=Math.max(cw/img.width,ch/img.height);
  const w=img.width*scale,h=img.height*scale;
  ctx.drawImage(img,(cw-w)/2,(ch-h)/2,w,h);
}

function filterString(v){
  const sepia=Math.max(0,v.warmth)/80;
  const cool=Math.max(0,-v.warmth)/100;
  return `hue-rotate(${v.hue}deg) saturate(${v.saturation}%) brightness(${v.brightness}%) contrast(${v.contrast}%) sepia(${sepia})`;
}

function drawAdjusted(ctx,v){
  ctx.save();
  ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  ctx.filter=filterString(v);
  fitDraw(ctx,gameImage);
  ctx.filter="none";
  if(v.warmth<0){
    ctx.fillStyle=`rgba(40,120,255,${Math.min(.25,Math.abs(v.warmth)/180)})`;
    ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
  }
  if(v.mist>0){
    ctx.fillStyle=`rgba(225,238,255,${v.mist/100})`;
    ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
  }
  ctx.restore();
}

function renderPlayer(){if(gameImage)drawAdjusted(pctx,currentValues())}
function renderTarget(){if(gameImage)drawAdjusted(tctx,targetValues)}

function score(values){
  let total=0;
  defs.forEach(d=>{
    const range=d.max-d.min;
    total+=Math.max(0,1-Math.abs(values[d.id]-targetValues[d.id])/range);
  });
  return Math.round(total/defs.length*100);
}

function ratingFromScore(score){
  return Math.max(1,Math.min(10,Math.ceil(score/10)));
}

function ratingColor(rating){
  const hue=Math.round((rating-1)/9*120);
  return `hsl(${hue} 82% 43%)`;
}

function updateHistory(){
  document.getElementById("history").innerHTML=scores.map((s,i)=>{
    const rating=ratingFromScore(s);
    return `<div class="try">
      <strong>Try ${i+1}</strong>
      <div class="bar"><div class="fill" style="width:${rating*10}%;background:${ratingColor(rating)}"></div></div>
      <span class="rating-badge" style="background:${ratingColor(rating)}">${rating}/10</span>
    </div>`;
  }).join("");
}

function resetGameState(){
  clearInterval(previewTimer);
  tries=0;scores=[];bestScore=0;bestValues=neutralValues();
  targetVisible=false;
  document.getElementById("attempt").textContent="1";
  document.getElementById("history").innerHTML="";
  document.getElementById("results").style.display="none";
  document.getElementById("submitBtn").disabled=true;
  document.getElementById("peekBtn").disabled=true;
  document.getElementById("targetCard").classList.remove("hidden");
  document.getElementById("previewCountdown").textContent="";
  document.getElementById("status").textContent="Study the target before it disappears.";
}


function setControlsDisabled(disabled){
  defs.forEach(d=>document.getElementById(d.id).disabled=disabled);
  document.getElementById("resetBtn").disabled=disabled;
}

function hideTarget(){
  targetVisible=false;
  document.getElementById("targetCard").classList.add("hidden");
  document.getElementById("previewCountdown").textContent="";
}

function beginTargetPreview(seconds=8){
  clearInterval(previewTimer);
  targetVisible=true;
  setControlsDisabled(true);
  document.getElementById("submitBtn").disabled=true;
  document.getElementById("peekBtn").disabled=true;
  document.getElementById("targetCard").classList.remove("hidden");
  let remaining=seconds;
  document.getElementById("previewCountdown").textContent=`${remaining}s`;
  document.getElementById("status").textContent="Study the target. Editing begins when it disappears.";
  previewTimer=setInterval(()=>{
    remaining--;
    document.getElementById("previewCountdown").textContent=remaining>0?`${remaining}s`:"";
    if(remaining<=0){
      clearInterval(previewTimer);
      hideTarget();
      setControlsDisabled(false);
      document.getElementById("submitBtn").disabled=false;
      document.getElementById("peekBtn").disabled=false;
      document.getElementById("status").textContent="Target hidden — adjust the sliders, then submit your edit.";
    }
  },1000);
}

function showTargetPeek(){
  targetVisible=true;
  document.getElementById("targetCard").classList.remove("hidden");
  document.getElementById("previewCountdown").textContent="3s";
  setControlsDisabled(true);
  document.getElementById("submitBtn").disabled=true;
  document.getElementById("peekBtn").disabled=true;
  let remaining=3;
  clearInterval(previewTimer);
  previewTimer=setInterval(()=>{
    remaining--;
    document.getElementById("previewCountdown").textContent=remaining>0?`${remaining}s`:"";
    if(remaining<=0){
      clearInterval(previewTimer);
      hideTarget();
      setControlsDisabled(false);
      if(tries<5){
        document.getElementById("submitBtn").disabled=false;
        document.getElementById("peekBtn").disabled=false;
        document.getElementById("status").textContent="Target hidden again. Make this attempt count.";
      }
    }
  },1000);
}

function startWithImage(src){
  resetGameState();
  targetValues=makeTarget(mode==="daily"?dateSeed(window.MATCH_IT_DAILY && window.MATCH_IT_DAILY.date):Math.random()*999999);
  setValues(neutralValues());
  gameImage=new Image();
  gameImage.onload=()=>{
    renderPlayer();renderTarget();
    document.getElementById("modeLabel").textContent=mode==="daily"?"Daily Challenge":"Sandbox Mode";
    showScreen("gameScreen");
    beginTargetPreview(8);
  };
  gameImage.onerror=()=>alert("The game image could not be loaded.");
  gameImage.src=src;
}

function startDaily(){
  mode="daily";
  const daily=window.MATCH_IT_DAILY;
  if(daily && daily.image){
    startWithImage(daily.image);
    return;
  }
  alert("No daily challenge file was found. Upload daily-challenge.js beside index.html.");
}

function settingFeedback(d){
  const range=d.max-d.min;
  const closeness=Math.max(0,1-Math.abs(bestValues[d.id]-targetValues[d.id])/range)*100;
  const rating=ratingFromScore(closeness);
  return {rating,color:ratingColor(rating)};
}

function showResults(){
  const winner=bestScore>=90;
  const bestRating=ratingFromScore(bestScore);
  document.getElementById("bestScore").textContent=(winner?"🏆 WINNER! ":"")+"Rating "+bestRating+"/10";
  const msg=document.getElementById("resultMessage");
  msg.className="result-message"+(winner?" winner":"");
  msg.textContent=winner
    ? `You matched the target in ${tries} chance${tries===1?"":"s"}!`
    : "Five chances used. Try again and aim for a 9 or 10.";
  document.getElementById("rows").innerHTML=defs.map(d=>{
    const feedback=settingFeedback(d);
    return `<tr><td>${d.name}</td><td><span class="feedback-badge" style="background:${feedback.color}">${feedback.rating}/10</span></td></tr>`;
  }).join("");
  document.getElementById("results").style.display="block";
  document.getElementById("submitBtn").disabled=true;
  document.getElementById("results").scrollIntoView({behavior:"smooth"});
}

document.getElementById("playBtn").onclick=()=>showScreen("modeScreen");
document.getElementById("modeBackBtn").onclick=()=>showScreen("titleScreen");
document.getElementById("quitBtn").onclick=()=>showScreen("titleScreen");
document.getElementById("changeModeBtn").onclick=()=>showScreen("modeScreen");
document.getElementById("dailyBtn").onclick=startDaily;

document.getElementById("sandboxBtn").onclick=()=>{
  document.getElementById("uploadArea").classList.toggle("show");
};

document.getElementById("upload").addEventListener("change",e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    mode="sandbox";
    selectedImageData=reader.result;
    document.getElementById("preview").src=selectedImageData;
    document.getElementById("preview").classList.add("show");
    document.getElementById("startSandboxBtn").style.display="block";
  };
  reader.readAsDataURL(file);
});

document.getElementById("startSandboxBtn").onclick=()=>startWithImage(selectedImageData);
document.getElementById("resetBtn").onclick=()=>setValues(neutralValues());
document.getElementById("peekBtn").onclick=()=>{
  if(targetVisible||tries>=5)return;
  tries++;
  document.getElementById("attempt").textContent=String(Math.min(tries+1,5));
  document.getElementById("status").textContent="Target peek used one attempt.";
  if(tries>=5){
    showResults();
    return;
  }
  showTargetPeek();
};
document.getElementById("againBtn").onclick=()=>mode==="daily"?startDaily():startWithImage(selectedImageData);

document.getElementById("submitBtn").onclick=()=>{
  if(tries>=5||targetVisible)return;
  const v=currentValues();
  const s=score(v);
  tries++;
  scores.push(s);
  if(s>bestScore){bestScore=s;bestValues={...v}}
  updateHistory();
  const rating=ratingFromScore(s);
  document.getElementById("status").textContent=s>=90?`Great match — rating ${rating}/10!`:`Rating ${rating}/10 — keep adjusting.`;
  document.getElementById("attempt").textContent=String(Math.min(tries+1,5));
  if(s>=90||tries>=5)showResults();
};

buildControls();
setValues(neutralValues());
</script>
</body>
</html>
